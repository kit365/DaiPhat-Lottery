spring:
  application:
    name: api-gateway
  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 3000
        max-interval: 15000
        max-attempts: 12
      discovery:
        enabled: true
        service-id: config-server
  config:
    import: "optional:configserver:"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
