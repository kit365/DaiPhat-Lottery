spring:
  application:
    name: api-gateway
  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 3000
        max-interval: 15000
        max-attempts: 12
      discovery:
        enabled: true
        service-id: config-server
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "${FRONTEND_URL:http://localhost:5173}"
              - "http://localhost:5173"
              - "http://localhost:8080"
              - "https://teddypet.id.vn"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
