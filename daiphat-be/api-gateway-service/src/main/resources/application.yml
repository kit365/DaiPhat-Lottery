spring:
  application:
    name: api-gateway
  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 1000
        max-interval: 5000
        max-attempts: 5
      discovery:
        enabled: false
        service-id: config-server
  config:
    import: "optional:configserver:http://localhost:8888"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
