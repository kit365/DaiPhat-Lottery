server:
  port: ${CORE_API_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: daiphat
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${CORE_MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${CORE_MULTIPART_MAX_REQUEST_SIZE:5MB}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    token-url: https://oauth2.googleapis.com/token
    token-info-url: https://oauth2.googleapis.com/tokeninfo
    user-info-url: https://www.googleapis.com/oauth2/v3/userinfo

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

daiphat:
  storage:
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME}
      api-key: ${CLOUDINARY_API_KEY}
      api-secret: ${CLOUDINARY_API_SECRET}
      root-folder: ${CLOUDINARY_ROOT_FOLDER:daiphat}
  auth:
    default-operator-permissions:
      - "article:view"
      - "article:create"
      - "article:edit"
      - "article:delete"
      - "member:view"
      - "member:create"
      - "member:edit"
      - "member:delete"
      - "provider:view"
      - "provider:create"
      - "provider:edit"
    seed:
      admin:
        username: ${AUTH_SEED_ADMIN_USERNAME:}
        password: ${AUTH_SEED_ADMIN_PASSWORD:}
        email: ${AUTH_SEED_ADMIN_EMAIL:}
        first-name: ${AUTH_SEED_ADMIN_FIRST_NAME:}
        last-name: ${AUTH_SEED_ADMIN_LAST_NAME:}
      member:
        username: ${AUTH_SEED_MEMBER_USERNAME:}
        password: ${AUTH_SEED_MEMBER_PASSWORD:}
        email: ${AUTH_SEED_MEMBER_EMAIL:}
        first-name: ${AUTH_SEED_MEMBER_FIRST_NAME:}
        last-name: ${AUTH_SEED_MEMBER_LAST_NAME:}
      street-agent:
        username: ${AUTH_SEED_STREET_AGENT_USERNAME:}
        password: ${AUTH_SEED_STREET_AGENT_PASSWORD:}
        email: ${AUTH_SEED_STREET_AGENT_EMAIL:}
        first-name: ${AUTH_SEED_STREET_AGENT_FIRST_NAME:}
        last-name: ${AUTH_SEED_STREET_AGENT_LAST_NAME:}
      operator:
        username: ${AUTH_SEED_OPERATOR_USERNAME:}
        password: ${AUTH_SEED_OPERATOR_PASSWORD:}
        email: ${AUTH_SEED_OPERATOR_EMAIL:}
        first-name: ${AUTH_SEED_OPERATOR_FIRST_NAME:}
        last-name: ${AUTH_SEED_OPERATOR_LAST_NAME:}
    jwt:
      issuer: ${AUTH_JWT_ISSUER:daiphat}
      secret: ${AUTH_JWT_SECRET}
      access-token-ttl-seconds: ${AUTH_JWT_ACCESS_TOKEN_TTL_SECONDS:900}
      refresh-token-ttl-seconds: ${AUTH_JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
    cookie:
      name: ${AUTH_REFRESH_COOKIE_NAME:refresh_token}
      secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
      same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
      path: ${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}
    cors:
      allowed-methods: ${AUTH_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
      allowed-headers: ${AUTH_CORS_ALLOWED_HEADERS:*}
      allow-credentials: ${AUTH_CORS_ALLOW_CREDENTIALS:true}
      max-age: ${AUTH_CORS_MAX_AGE:3600}
    cache:
      verification-token-ttl-seconds: ${AUTH_VERIFICATION_TOKEN_TTL_SECONDS:86400}
      otp-ttl-seconds: ${AUTH_OTP_TTL_SECONDS:300}
      reset-token-ttl-seconds: ${AUTH_RESET_TOKEN_TTL_SECONDS:900}
      invite-ttl-seconds: ${AUTH_INVITE_TTL_SECONDS:86400}
    password-policy:
      min-length: ${AUTH_PASSWORD_MIN_LENGTH:6}
      max-length: ${AUTH_PASSWORD_MAX_LENGTH:100}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
