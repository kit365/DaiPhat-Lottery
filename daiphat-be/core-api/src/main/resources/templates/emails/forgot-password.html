<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Wrap content in the Master Layout -->
<!-- Passing title, content fragment, and hasUnsubscribe=true. No extraStyles needed as .code-box is now global -->
<div th:replace="~{emails/layout/main-layout :: layout('Khôi phục mật khẩu', ~{::content}, ~{}, true)}">
  
  <th:block th:fragment="content">
    <tr>
      <td align="center" style="font-size:0px;padding:10px 25px;word-break:break-word;">
        <div style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:24px;font-weight:bold;line-height:24px;text-align:center;color:#f1f5f9;">
          Khôi phục mật khẩu
        </div>
      </td>
    </tr>
    <tr>
      <td align="center" style="font-size:0px;padding:10px 25px;word-break:break-word;">
        <div style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:16px;line-height:24px;text-align:center;color:#94a3b8;">
          Mã xác thực của bạn ở bên dưới - hãy nhập mã này vào trình duyệt để tiếp tục quá trình đặt lại mật khẩu.
        </div>
      </td>
    </tr>
    <tr>
      <td align="center" style="font-size:16px;padding:30px;word-break:break-word;">
        <div class="code-box" style="background-color: #0f172a; border: 1px dashed #34d399; border-radius: 8px; padding: 30px;">
          <div style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:42px;font-weight:bold;letter-spacing:5px;line-height:1;text-align:center;color:#34d399;" th:text="${otp}">
            DFY-X7U
          </div>
        </div>
      </td>
    </tr>
    <tr>
      <td align="center" style="font-size:0px;padding:10px 25px;padding-top:20px;word-break:break-word;">
        <div style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;line-height:24px;text-align:center;color:#94a3b8;">
          Nếu bạn không thực hiện yêu cầu này, đừng lo lắng, bạn có thể an tâm bỏ qua email này.
        </div>
      </td>
    </tr>
  </th:block>

</div>
</html>
