server:
  port: 8080

spring:
  datasource:
    # Align with docker-compose.yml host mapping (LOCAL_POSTGRES_PORT, default 5434).
    url: jdbc:postgresql://${CORE_POSTGRES_HOST:localhost}:${LOCAL_POSTGRES_PORT:${CORE_DB_PORT:5434}}/${CORE_POSTGRES_DB:daiphat_core_db}?charSet=UTF-8
    username: ${CORE_POSTGRES_USER:sa}
    password: ${CORE_POSTGRES_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    out-of-order: true
    # Incomplete IntelliJ classpath must not treat disk migrations as missing.
    ignore-migration-patterns: "*:missing"
    # repair-on-migrate was removed in Spring Boot 3.4; LocalFlywayConfig repairs only after migrate failure.
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  data:
    redis:
      host: ${CORE_REDIS_HOST:localhost}
      port: ${LOCAL_REDIS_PORT:${CORE_REDIS_PORT:6380}}
  mail:
    # Local .env uses AUTH_LOCAL_MAIL_*; MAIL_* remains an optional override.
    # Empty defaults avoid PlaceholderResolutionException when IntelliJ skips repo-root .env.
    host: ${MAIL_HOST:${AUTH_LOCAL_MAIL_HOST:}}
    port: ${MAIL_PORT:${AUTH_LOCAL_MAIL_PORT:587}}
    username: ${MAIL_USERNAME:${AUTH_LOCAL_MAIL_USERNAME:}}
    password: ${MAIL_PASSWORD:${AUTH_LOCAL_MAIL_PASSWORD:}}
    from: ${MAIL_FROM:${AUTH_LOCAL_MAIL_USERNAME:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  # IntelliJ often does not load repo-root .env — keep Google OAuth placeholders local-safe.
  google:
    client-id: ${GOOGLE_WEB_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    token-url: https://oauth2.googleapis.com/token
    token-info-url: https://oauth2.googleapis.com/tokeninfo
    user-info-url: https://www.googleapis.com/oauth2/v3/userinfo

management:
  health:
    mail:
      enabled: false

daiphat:
  # Local runs use the same Cloudinary storage as production by default so uploaded
  # contracts and other files are not left in the working tree. Override with
  # STORAGE_PROVIDER=local only when filesystem storage is intentionally needed.
  storage:
    provider: ${STORAGE_PROVIDER:cloudinary}
  vendor:
    test-seed:
      enabled: ${VENDOR_TEST_SEED_ENABLED:true}

  auth:
    frontend-url: http://localhost:5173
    jwt:
      issuer: ${AUTH_JWT_ISSUER:daiphat-core-api}
      secret: ${AUTH_JWT_SECRET:daiphat_super_secret_jwt_key_for_local_development_environment_32bytes}
      # Hardcoded for local: ignore AUTH_JWT_ACCESS_TOKEN_TTL_SECONDS=5 (refresh-test value)
      # which floods admin layout polls with 401s once the access token dies.
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: ${AUTH_JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
    cookie:
      # Literal name for HTTP localhost — __Secure-* cookies are rejected without HTTPS.
      name: refresh_token
      secure: false
      same-site: Lax
      path: /api/v1/auth
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
        - http://localhost:5174
        - http://127.0.0.1:5174
        - http://localhost:3000
        - http://127.0.0.1:3000
        - http://localhost:3001
        - http://127.0.0.1:3001
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
      max-age: 3600
    cache:
      verification-token-ttl-seconds: 86400
      otp-ttl-seconds: 300
      reset-token-ttl-seconds: 900
    password-policy:
      min-length: 6
      max-length: 100
  blog:
    seed:
      enabled: true
  lottery:
    seed:
      enabled: true
      tickets-per-station-per-date: 20
      serials-per-ticket: 10
      status-coverage:
        enabled: true
      southern-stations:
        enabled: true
  fortune:
    daily-limit-enabled: true
  order:
    seed:
      enabled: true
      pending-pickup:
        enabled: true
  sample-order:
    seed:
      enabled: true

logging:
  level:
    root: INFO
    com.daiphat: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
