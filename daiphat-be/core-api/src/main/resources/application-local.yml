server:
  port: 8080

spring:
  datasource:
    # Align with docker-compose.yml host mapping (LOCAL_POSTGRES_PORT, default 5434).
    url: jdbc:postgresql://${CORE_POSTGRES_HOST:localhost}:${LOCAL_POSTGRES_PORT:${CORE_DB_PORT:5434}}/${CORE_POSTGRES_DB:daiphat_core_db}?charSet=UTF-8
    username: ${CORE_POSTGRES_USER:sa}
    password: ${CORE_POSTGRES_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    out-of-order: true
    # Intentionally-removed seed scripts must not fail local boot.
    # List form required (FlywayProperties expects List<String>).
    # If history drifts: drop postgres volume and re-run — no repair bean.
    ignore-migration-patterns:
      - "*:missing"
    # After docker volume wipe / schema cleanup, leftover sequences can leave
    # public non-empty without flyway_schema_history. Baseline lets migrate proceed.
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      # Match application.yml (50MB). Phone ticket photos often exceed 15MB.
      max-file-size: ${CORE_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${CORE_MULTIPART_MAX_REQUEST_SIZE:50MB}
  data:
    redis:
      host: ${CORE_REDIS_HOST:localhost}
      port: ${LOCAL_REDIS_PORT:${CORE_REDIS_PORT:6380}}
  mail:
    # Local .env uses AUTH_LOCAL_MAIL_*; MAIL_* remains an optional override.
    # Empty defaults avoid PlaceholderResolutionException when IntelliJ skips repo-root .env.
    host: ${MAIL_HOST:${AUTH_LOCAL_MAIL_HOST:}}
    port: ${MAIL_PORT:${AUTH_LOCAL_MAIL_PORT:587}}
    username: ${MAIL_USERNAME:${AUTH_LOCAL_MAIL_USERNAME:}}
    password: ${MAIL_PASSWORD:${AUTH_LOCAL_MAIL_PASSWORD:}}
    from: ${MAIL_FROM:${AUTH_LOCAL_MAIL_USERNAME:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  # IntelliJ often does not load repo-root .env — keep Google OAuth placeholders local-safe.
  google:
    client-id: ${GOOGLE_WEB_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    token-url: https://oauth2.googleapis.com/token
    token-info-url: https://oauth2.googleapis.com/tokeninfo
    user-info-url: https://www.googleapis.com/oauth2/v3/userinfo

management:
  health:
    mail:
      enabled: false

daiphat:
  # Local runs use the same Cloudinary storage as production by default so uploaded
  # contracts and other files are not left in the working tree. Override with
  # STORAGE_PROVIDER=local only when filesystem storage is intentionally needed.
  storage:
    provider: ${STORAGE_PROVIDER:cloudinary}
  ticket-vision:
    service:
      # ticket-vision Uvicorn default (see daiphat-ai/scripts/run_ticket_vision.sh)
      base-url: ${DAIPHAT_TICKET_VISION_BASE_URL:http://localhost:8090}
  vendor:
    test-seed:
      enabled: ${VENDOR_TEST_SEED_ENABLED:true}

  auth:
    # Bootstrap canonical demo accounts (admin/member/street_agent/operator).
    seed:
      enabled: true
    frontend-url: http://localhost:5173
    jwt:
      issuer: ${AUTH_JWT_ISSUER:daiphat-core-api}
      secret: ${AUTH_JWT_SECRET:daiphat_super_secret_jwt_key_for_local_development_environment_32bytes}
      # Local default 900s. Repo-root .env AUTH_JWT_ACCESS_TOKEN_TTL_SECONDS overrides this
      # (CoreApiApplication maps it onto daiphat.auth.jwt.access-token-ttl-seconds) — never leave
      # that env at 5 outside intentional refresh tests or admin OCR/API calls get constant 401s.
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: ${AUTH_JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
    cookie:
      # Literal name for HTTP localhost — __Secure-* cookies are rejected without HTTPS.
      # Path=/ so the FE same-origin proxy and /api/v1/* share one cookie (avoids dual
      # Path=/ vs Path=/api/v1/auth cookies that make Spring pick a stale refresh token).
      name: refresh_token
      secure: false
      same-site: Lax
      path: /
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
        - http://localhost:5174
        - http://127.0.0.1:5174
        - http://localhost:3000
        - http://127.0.0.1:3000
        - http://localhost:3001
        - http://127.0.0.1:3001
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
      max-age: 3600
    cache:
      verification-token-ttl-seconds: 86400
      otp-ttl-seconds: 300
      reset-token-ttl-seconds: 900
    password-policy:
      min-length: 6
      max-length: 100
  lottery:
    seed:
      # Shared inventory pool (PN-SEED / IBSEED): past ≤30 days + today/tomorrow.
      # Off by default: the reset rewrites tens of thousands of rows inside long transactions
      # that lock member tickets (payout/orders) until it finishes. Set LOTTERY_SEED_ENABLED=true
      # (plus the win50/order flags below) for one restart to regenerate demo data.
      enabled: ${LOTTERY_SEED_ENABLED:false}
      past-days: 30
      tickets-per-batch-past: 36
      serials-per-ticket: 10
      status-coverage:
        # Optional QA matrix — off by default to avoid a second ticket universe.
        enabled: false
      southern-stations:
        enabled: true
        overwrite-existing: true
      win50-payout:
        # Mark winners FROM IBSEED past inventory for member payout demos.
        enabled: ${LOTTERY_SEED_WIN50_PAYOUT_ENABLED:false}
  fortune:
    daily-limit-enabled: true
  order:
    seed:
      # Lifecycle orders; prefers real southern stations (buyable overlay). Same caveat as lottery.seed.
      enabled: ${ORDER_SEED_ENABLED:false}
  sample-order:
    seed:
      enabled: false

logging:
  level:
    root: INFO
    com.daiphat: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
