spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/daiphat_core_db?charSet=UTF-8
    username: sa
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    out-of-order: true
  data:
    redis:
      host: localhost
      port: 6380
    mongodb:
      uri: mongodb://core_admin:core_pass_2026@localhost:27018/daiphat_core_db?authSource=admin
  mail:
    host: ${AUTH_LOCAL_MAIL_HOST}
    port: ${AUTH_LOCAL_MAIL_PORT}
    username: ${AUTH_LOCAL_MAIL_USERNAME}
    password: ${AUTH_LOCAL_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
daiphat:
  auth:
    frontend-url: http://localhost:5173
    cookie:
      secure: false
      same-site: Lax
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
  blog:
    seed:
      enabled: true
  payment:
    payos:
      return-path: ${PAYOS_RETURN_PATH:/checkout/result}
      cancel-path: ${PAYOS_CANCEL_PATH:/checkout/result}
  order:
    seed:
      enabled: false

logging:
  level:
    root: INFO
    com.daiphat: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
