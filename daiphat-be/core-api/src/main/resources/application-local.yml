server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/daiphat_core_db?charSet=UTF-8
    username: sa
    password: 12345
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    out-of-order: true
    repair-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  data:
    redis:
      host: localhost
      port: 6380
  mail:
    # Local .env uses AUTH_LOCAL_MAIL_*; MAIL_* remains an optional override.
    host: ${MAIL_HOST:${AUTH_LOCAL_MAIL_HOST}}
    port: ${MAIL_PORT:${AUTH_LOCAL_MAIL_PORT}}
    username: ${MAIL_USERNAME:${AUTH_LOCAL_MAIL_USERNAME}}
    password: ${MAIL_PASSWORD:${AUTH_LOCAL_MAIL_PASSWORD}}
    from: ${MAIL_FROM:${AUTH_LOCAL_MAIL_USERNAME}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

daiphat:
  auth:
    frontend-url: http://localhost:5173
    jwt:
      access-token-ttl-seconds: ${AUTH_JWT_ACCESS_TOKEN_TTL_SECONDS}
    cookie:
      name: refresh_token
      secure: false
      same-site: Lax
      path: /api/v1/auth
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
        - http://localhost:5174
        - http://127.0.0.1:5174
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      allowed-headers:
        - "*"
      allow-credentials: true
      max-age: 3600
    cache:
      verification-token-ttl-seconds: 86400
      otp-ttl-seconds: 300
      reset-token-ttl-seconds: 900
    password-policy:
      min-length: 6
      max-length: 100
  lottery:
    seed:
      southern-stations:
        enabled: true

logging:
  level:
    root: INFO
    com.daiphat: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
