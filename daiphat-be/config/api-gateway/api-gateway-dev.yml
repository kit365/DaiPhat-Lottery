server:
  port: 8080




daiphat:
  gateway:
    account-service-uri: http://localhost:8081

spring:
  application:
    name: api-gateway

  cloud:
    config:
      discovery:
        enabled: true
    gateway:
      routes:
        - id: account-service
          uri: ${daiphat.gateway.account-service-uri}
          predicates:
            - Path=/api/v1/accounts/**, /api/v1/auth/**, /api/v1/points/**, /api/v1/rewards/**, /api/v1/banks/**, /api/v1/bank-information/**, /api/v1/users/**, /api/v1/roles/**, /api/v1/permissions/**

        - id: account-service-docs
          uri: ${daiphat.gateway.account-service-uri}
          predicates:
            - Path=/v3/api-docs/account-service
          filters:
            - RewritePath=/v3/api-docs/account-service, /v3/api-docs

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/daiphat
          jwk-set-uri: http://localhost:8180/realms/daiphat/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
    com.daiphat: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
