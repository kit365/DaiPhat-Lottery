server:
  port: ${GATEWAY_PORT:8080}

daiphat:
  gateway:
    account-service-uri: ${GATEWAY_ACCOUNT_SERVICE_URI:lb://account-service}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Route definitions
      routes:
        # Account Service routes
        - id: account-service
          uri: ${daiphat.gateway.account-service-uri}
          predicates:
            - Path=/api/v1/accounts/**, /api/v1/auth/**, /api/v1/points/**, /api/v1/rewards/**, /api/v1/banks/**, /api/v1/bank-information/**, /api/v1/users/**, /api/v1/roles/**, /api/v1/permissions/**

        # Account Service Swagger Docs
        - id: account-service-docs
          uri: ${daiphat.gateway.account-service-uri}
          predicates:
            - Path=/v3/api-docs/account-service
          filters:
            - RewritePath=/v3/api-docs/account-service, /v3/api-docs

      # CORS configuration has been moved to SecurityConfig.java

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:${KEYCLOAK_PORT:8180}/realms/daiphat}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:${KEYCLOAK_PORT:8180}/realms/daiphat/protocol/openid-connect/certs}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:${DISCOVERY_SERVER_PORT:8761}/eureka/}
  instance:
    prefer-ip-address: true

# SpringDoc Aggregation (Hiển thị tài liệu từ các service)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Account Service
        url: /v3/api-docs/account-service

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
