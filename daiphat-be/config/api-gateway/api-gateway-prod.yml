server:
  port: ${GATEWAY_PORT}

daiphat:
  gateway:
    account-service-uri: ${GATEWAY_ACCOUNT_SERVICE_URI}

spring:
  application:
    name: api-gateway

  cloud:
    config:
      discovery:
        enabled: true
    gateway:
      routes:
        - id: account-service
          uri: ${daiphat.gateway.account-service-uri}
          predicates:
            - Path=/api/v1/accounts/**, /api/v1/auth/**, /api/v1/points/**, /api/v1/rewards/**, /api/v1/banks/**, /api/v1/bank-information/**, /api/v1/users/**, /api/v1/roles/**, /api/v1/permissions/**

        - id: account-service-docs
          uri: ${daiphat.gateway.account-service-uri}
          predicates:
            - Path=/v3/api-docs/account-service
          filters:
            - RewritePath=/v3/api-docs/account-service, /v3/api-docs

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Account Service
        url: /v3/api-docs/account-service

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway

logging:
  level:
    root: INFO
    com.daiphat: INFO
    org.springframework.security: WARN
    org.springframework.web: INFO
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
