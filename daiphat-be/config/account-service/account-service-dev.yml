server:
  port: 8081
  forward-headers-strategy: framework

springdoc:
  openapi:
    servers:
      - url: http://localhost:8080
        description: API Gateway

# Overrides for .env variables when running locally


daiphat:
  auth:
    keycloak:
      auth-server-url: http://localhost:8180
      realm: daiphat
      clientId: daiphat-client
      clientSecret: ""
      adminClientId: daiphat-be
      adminClientSecret: daiphat-be-secret

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://localhost:5432/daiphat_account_db?charSet=UTF-8
    username: sa
    password: 12345
  cloud:
    config:
      discovery:
        enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Local IntelliJ runs against Docker Keycloak at localhost:8180
          issuer-uri: http://localhost:8180/realms/daiphat
          jwk-set-uri: http://localhost:8180/realms/daiphat/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:daiphat-client}
            client-secret: ""
            authorization-grant-type: password
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/daiphat
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      # Local IntelliJ runs against Docker Eureka at localhost:8761
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
    com.daiphat: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
