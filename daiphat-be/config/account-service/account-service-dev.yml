server:
  port: 8081

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://localhost:5432/daiphat_account_db
    username: sa
    password: '12345'
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/daiphat
          jwk-set-uri: http://localhost:8180/realms/daiphat/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            client-id: daiphat-client
            client-secret: daiphat-secret
            authorization-grant-type: password
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/daiphat

# Cấu hình tùy chỉnh cho AuthAdminAdapter (Hệ thống Đại Phát)
daiphat:
  auth:
    keycloak:
      auth-server-url: http://localhost:8180
      realm: daiphat
      client-id: daiphat-client
      client-secret: daiphat-secret

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
