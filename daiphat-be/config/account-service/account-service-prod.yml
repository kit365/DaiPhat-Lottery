server:
  port: ${ACCOUNT_SERVICE_PORT}
  forward-headers-strategy: framework

springdoc:
  openapi:
    servers:
      - url: https://teddypet.id.vn
        description: API Gateway (Production)

daiphat:
  auth:
    keycloak:
      auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL}
      internal-auth-server-url: ${KEYCLOAK_INTERNAL_URL:}
      realm: ${KEYCLOAK_REALM}
      clientId: ${KEYCLOAK_CLIENT_ID}
      clientSecret: ""
      adminClientId: daiphat-be
      adminClientSecret: daiphat-be-secret

spring:
  application:
    name: account-service
  cloud:
    config:
      discovery:
        enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${DB_PORT}/${POSTGRES_DB}?charSet=UTF-8
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
      client:
        registration:
          keycloak:
            client-id: daiphat-client
            client-secret: ""
            authorization-grant-type: password
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://discovery-server:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

logging:
  level:
    root: INFO
    com.daiphat: INFO
    org.springframework.security: WARN
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
# Triggering CI/CD after workflow update
