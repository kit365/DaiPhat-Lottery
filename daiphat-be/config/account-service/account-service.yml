server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

daiphat:
  auth:
    lockout:
      failure-threshold: 5
      backoff-seconds: [60, 120, 300, 600, 1800]
      spam:
        max-attempts: 3
        window-seconds: 5
