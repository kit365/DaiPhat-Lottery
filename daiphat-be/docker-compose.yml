name: daiphat-be-local

services:
  postgres-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: daiphat_core_db
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: "12345"
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d daiphat_core_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: core_admin
      MONGO_INITDB_ROOT_PASSWORD: core_pass_2026
      MONGO_INITDB_DATABASE: daiphat_core_db
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "core_admin", "--password", "core_pass_2026", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile.local
    env_file:
      - ./core-api/.env
    environment:
      SPRING_PROFILES_ACTIVE: local
      CORE_API_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/daiphat_core_db?charSet=UTF-8
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "12345"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_MONGODB_URI: mongodb://core_admin:core_pass_2026@mongo:27017/daiphat_core_db?authSource=admin
    ports:
      - "8080:8080"
    volumes:
      - ./core-api:/workspace
      - maven_cache:/root/.m2
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      retries: 30

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  maven_cache:
