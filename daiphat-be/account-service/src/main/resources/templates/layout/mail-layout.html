<!doctype html>
<html lang="und" dir="auto" xmlns:th="http://www.thymeleaf.org" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
  <head>
    <title th:text="${subject}">DaiPhat Platform</title>
    <!--[if !mso]><!-->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!--<![endif]-->
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style type="text/css">
      #outlook a { padding:0; }
      body { margin:0;padding:0;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%; font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif; }
      table, td { border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt; }
      img { border:0;height:auto;line-height:100%; outline:none;text-decoration:none;-ms-interpolation-mode:bicubic; }
      p { display:block;margin:13px 0; }
    </style>
    <!--[if mso]>
    <noscript>
    <xml>
    <o:OfficeDocumentSettings>
      <o:AllowPNG/>
      <o:PixelsPerInch>96</o:PixelsPerInch>
    </o:OfficeDocumentSettings>
    </xml>
    </noscript>
    <![endif]-->
    <!--[if lte mso 11]>
    <style type="text/css">
      .mj-outlook-group-fix { width:100% !important; }
    </style>
    <![endif]-->
  </head>
  <body th:fragment="layout(content)" style="word-spacing:normal;background-color:#0F172A;">
    <div style="background-color:#0F172A;" role="article" lang="und" dir="auto">
      
      <!-- Logo Section -->
      <div style="margin:0px auto;max-width:440px;">
        <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:100%;">
          <tbody>
            <tr>
              <td style="direction:ltr;font-size:0px;padding:24px 0 12px 0;text-align:center;">
                <div th:replace="~{fragments/branding :: logo}"></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Main Content Container -->
      <div style="background:#1E293B;background-color:#1E293B;margin:0px auto;max-width:440px; border-radius: 12px; border: 1px solid #334155;">
        <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="background:#1E293B;background-color:#1E293B;width:100%; border-radius: 12px;">
          <tbody>
            <tr>
              <td style="direction:ltr;font-size:0px;padding:28px 32px;text-align:left;">
                <!-- Đây là nơi nạp nội dung động -->
                <div th:replace="${content}"></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Footer Section -->
      <div style="margin:0px auto;max-width:440px;">
        <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:100%;">
          <tbody>
            <tr>
              <td style="direction:ltr;font-size:0px;padding:12px 24px 32px 24px;text-align:center;">
                <div th:replace="~{fragments/branding :: small-logo}"></div>
                <div th:replace="~{fragments/footer :: address}"></div>
                <div th:replace="~{fragments/footer :: social-icons}"></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </body>
</html>
