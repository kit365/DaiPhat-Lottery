<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{emails/layout/main-layout :: layout('Mật khẩu mới', ~{::content}, ~{}, false)}">
  
  <th:block th:fragment="content">
    <tr>
      <td align="center" style="font-size:0px;padding:10px 25px;word-break:break-word;">
        <div style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:24px;font-weight:bold;line-height:24px;text-align:center;color:#f1f5f9;">
          Mật khẩu của bạn đã được đặt lại
        </div>
      </td>
    </tr>
    <tr>
      <td align="center" style="font-size:0px;padding:10px 25px;word-break:break-word;">
        <div style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:16px;line-height:24px;text-align:center;color:#94a3b8;">
          Chào <span th:text="${firstName}">Bạn</span>, Quản trị viên đã đặt lại mật khẩu cho tài khoản của bạn thành công. Dưới đây là mật khẩu tạm thời mới của bạn:
        </div>
      </td>
    </tr>
    <tr>
      <td align="center" style="font-size:16px;padding:30px;word-break:break-word;">
        <div class="code-box" style="background-color: #0f172a; border: 1px dashed #34d399; border-radius: 8px; padding: 25px; text-align: center;">
          <div>
            <span style="color: #64748b; font-size: 14px;">Mật khẩu tạm thời mới:</span><br/>
            <strong style="color: #34d399; font-size: 24px; letter-spacing: 2px;" th:text="${password}">ABC-123</strong>
          </div>
        </div>
      </td>
    </tr>
    <tr>
      <td align="center" style="font-size:0px;padding:10px 25px;word-break:break-word;">
        <div style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;line-height:24px;text-align:center;color:#94a3b8;">
          Vui lòng đăng nhập và thay đổi mật khẩu của bạn ngay lập tức để đảm bảo an toàn cho tài khoản.
        </div>
      </td>
    </tr>
    <tr>
      <td align="center" style="font-size:16px;padding:30px;word-break:break-word;">
        <a th:href="${loginUrl}" 
           style="background-color: #34d399; color: #0f172a; padding: 14px 28px; text-decoration: none; border-radius: 8px; font-weight: bold; display: inline-block; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px;" 
           class="btn-action">
          Đăng nhập ngay
        </a>
      </td>
    </tr>
  </th:block>

</div>
</html>
