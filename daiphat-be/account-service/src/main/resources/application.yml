spring:
  threads:
    virtual:
      enabled: true
  application:
    name: account-service
  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 1000
        max-interval: 5000
        max-attempts: 5
      discovery:
        enabled: true
        service-id: config-server
  config:
    import: "optional:configserver:http://localhost:8888"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
