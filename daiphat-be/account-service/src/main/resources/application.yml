spring:
  threads:
    virtual:
      enabled: true
  application:
    name: account-service
  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 3000
        max-interval: 15000
        max-attempts: 12
      discovery:
        enabled: true
        service-id: config-server
  config:
    import: "optional:configserver:"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
