# Local run without Eureka: use direct localhost URLs so routes do not return 503 (no lb:// instances).
# Profile dev is default in application.yml. Conversation/WebSocket (/ws/**) → port CONVERSATION_SERVICE_PORT (8084): start conversation-service or expect 503 from gateway (not 500) if handler is enabled.
spring:
  config:
    activate:
      on-profile: dev

smartlotto:
  gateway:
    account-service-uri: http://localhost:${ACCOUNT_SERVICE_PORT:8081}
    booking-service-uri: http://localhost:${BOOKING_SERVICE_PORT:8082}
    conversation-service-uri: http://localhost:${CONVERSATION_SERVICE_PORT:8084}
    room-service-uri: http://localhost:${ROOM_SERVICE_PORT:8083}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
