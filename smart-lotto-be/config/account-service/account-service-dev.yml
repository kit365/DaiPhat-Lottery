spring:
  application:
    name: ACCOUNT-SERVICE
  datasource:
    url: jdbc:postgresql://localhost:5432/account_db
    username: sa
    password: "12345"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # Redis config for dev (Hardcoded)
  data:
    redis:
      host: localhost
      port: 6379

  # RabbitMQ config for dev (Hardcoded)
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    appname: ACCOUNT-SERVICE

# Keycloak Auth (Hardcoded for dev)
smartlotto:
  auth:
    keycloak:
      realm: smartlotto
      auth-server-url: http://localhost:8180
      client-id: account-service
      client-secret: dummy-secret
