spring:
  application:
    name: ACCOUNT-SERVICE
  datasource:
    url: jdbc:postgresql://localhost:5432/account_db
    username: sa
    password: "12345"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:${KEYCLOAK_PORT:8180}/realms/smartlotto}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:${KEYCLOAK_PORT:8180}/realms/smartlotto/protocol/openid-connect/certs}

  # Redis config for dev (Hardcoded)
  data:
    redis:
      host: localhost
      port: 6379

  # RabbitMQ config for dev (Hardcoded)
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    appname: ACCOUNT-SERVICE

server:
  port: ${ACCOUNT_SERVICE_PORT:8081}
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  show-actuator: true

# Keycloak Auth (Hardcoded for dev)
smartlotto:
  auth:
    keycloak:
      realm: ${KEYCLOAK_REALM:smartlotto}
      auth-server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
      client-id: ${KEYCLOAK_CLIENT_ID:smartlotto-client}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:smartlotto-secret}

