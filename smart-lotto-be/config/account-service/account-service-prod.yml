spring:
  datasource:
    url: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:account_db}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

  # Redis config for prod (Dynamic)
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379

  # RabbitMQ config for prod (Dynamic)
  rabbitmq:
    host: ${RABBIT_HOST:rabbitmq}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://discovery-server:8761/eureka/}
  instance:
    prefer-ip-address: true

# Keycloak Auth (Dynamic for prod)
smartlotto:
  auth:
    keycloak:
      realm: ${KEYCLOAK_REALM:smartlotto}
      auth-server-url: ${KEYCLOAK_URL:http://keycloak:8180}
      client-id: ${KEYCLOAK_CLIENT_ID:account-service}
      client-secret: ${KEYCLOAK_CLIENT_SECRET}
