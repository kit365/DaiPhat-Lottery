spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/account_db
    username: sa
    password: "12345"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:smartlotto-client}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:smartlotto-secret}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/smartlotto}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/smartlotto/protocol/openid-connect/certs}

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8081

smartlotto:
  auth:
    keycloak:
      realm: smartlotto
      auth-server-url: http://localhost:8180
      client-id: smartlotto-client
      client-secret: smartlotto-secret
    cache:
      remember-me-ttl: 86400 # 24h
      mfa-session-ttl: 900 # 15m
