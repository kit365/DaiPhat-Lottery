services:
  # --- Infrastructure Layer (For Local Development) ---
  postgres-db:
    image: postgres:16-alpine
    container_name: smartlotto-postgres
    restart: always
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB: smartlotto_db
    volumes:
      - ./infra/postgres:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d smartlotto_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartlotto-network

  redis:
    image: redis:alpine
    container_name: smartlotto-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - smartlotto-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: smartlotto-keycloak
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-db:5432/smartlotto_db
      KC_DB_USERNAME: sa
      KC_DB_PASSWORD: 12345
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - smartlotto-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: smartlotto-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - smartlotto-network

networks:
  smartlotto-network:
    driver: bridge

volumes:
  postgres_data:
