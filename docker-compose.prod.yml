# Production docker-compose definition for DaiPhat Lottery Platform (Production)
name: daiphat-prod

x-dozzle-infrastructure-labels: &dozzle-infrastructure-labels
  dev.dozzle.group: Infrastructure

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    labels: *dozzle-infrastructure-labels
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daiphat_core_db}
      POSTGRES_USER: ${POSTGRES_USER:-daiphat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 768m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    labels: *dozzle-infrastructure-labels
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: >-
      sh -c 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
      --maxmemory 256mb --maxmemory-policy volatile-lru'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 384m

  ai:
    image: ${AI_IMAGE:-docker.io/kitops365/daiphat-ai:prod}
    pull_policy: always
    restart: unless-stopped
    labels:
      dev.dozzle.group: AI
      dev.dozzle.name: AI
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 8
    mem_limit: 256m

  # Legacy direct OCR deployment. Unified AI CD uses docker-compose.ai.yml.
  # Do not enable this profile when the managed OCR gateway owns ticket-vision.
  # Disabled in a full-stack deploy unless COMPOSE_PROFILES includes "ocr".
  # `scripts/deploy-component.sh ticket-vision ...` targets this service
  # directly after an immutable OCR image has been published.
  ticket-vision:
    image: ${TICKET_VISION_IMAGE:-docker.io/kitops365/daiphat-ticket-vision:prod}
    pull_policy: always
    restart: unless-stopped
    profiles: ["ocr"]
    labels:
      dev.dozzle.group: AI
      dev.dozzle.name: Ticket Vision
    environment:
      HOME: /cache
      EASYOCR_MODULE_PATH: /cache/easyocr
      PADDLE_PDX_CACHE_HOME: /cache/paddlex
      HF_HOME: /cache/huggingface
      TORCH_HOME: /cache/torch
      YOLO_CONFIG_DIR: /cache/ultralytics
      TICKET_VISION_RECOGNITION_ENGINE: ${TICKET_VISION_RECOGNITION_ENGINE:-groq}
      TICKET_VISION_YOLO_DEVICE: ${TICKET_VISION_YOLO_DEVICE:-cpu}
      TICKET_VISION_YOLO_MODEL_PATH: ${TICKET_VISION_YOLO_MODEL_PATH:-models/best.pt}
      TICKET_VISION_LLM_YOLO_GUIDANCE: ${TICKET_VISION_LLM_YOLO_GUIDANCE:-true}
      TICKET_VISION_YOLO_CONFIDENCE_THRESHOLD: ${TICKET_VISION_YOLO_CONFIDENCE_THRESHOLD:-0.35}
      TICKET_VISION_YOLO_FIELD_CONFIDENCE_THRESHOLD: ${TICKET_VISION_YOLO_FIELD_CONFIDENCE_THRESHOLD:-0.25}
      TICKET_VISION_YOLO_IOU_THRESHOLD: ${TICKET_VISION_YOLO_IOU_THRESHOLD:-0.45}
      TICKET_VISION_YOLO_TICKET_CLASS: ${TICKET_VISION_YOLO_TICKET_CLASS:-Lottery-ticket}
      TICKET_VISION_MAX_FILE_SIZE_MB: ${TICKET_VISION_MAX_FILE_SIZE_MB:-5}
      TICKET_VISION_MAX_IMAGE_DIMENSION: ${TICKET_VISION_MAX_IMAGE_DIMENSION:-1920}
      TICKET_VISION_MAX_TICKETS_PER_IMAGE: ${TICKET_VISION_MAX_TICKETS_PER_IMAGE:-15}
      TICKET_VISION_HIGH_CONFIDENCE_THRESHOLD: ${TICKET_VISION_HIGH_CONFIDENCE_THRESHOLD:-0.85}
      TICKET_VISION_LOW_CONFIDENCE_THRESHOLD: ${TICKET_VISION_LOW_CONFIDENCE_THRESHOLD:-0.70}
      TICKET_VISION_STATION_FUZZY_MATCH_THRESHOLD: ${TICKET_VISION_STATION_FUZZY_MATCH_THRESHOLD:-80}
      TICKET_VISION_DETECTOR_STRATEGY: ${TICKET_VISION_DETECTOR_STRATEGY:-contour}
      TICKET_VISION_LAYOUT_STRATEGY: ${TICKET_VISION_LAYOUT_STRATEGY:-generic}
      TICKET_VISION_ENABLE_OCR_FALLBACK: ${TICKET_VISION_ENABLE_OCR_FALLBACK:-true}
      OCR_AI_PROVIDER: ${OCR_AI_PROVIDER:-}
      GROQ_API_BASE_URL: ${GROQ_API_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.6-27b}
      GROQ_READ_TIMEOUT_SECONDS: ${GROQ_READ_TIMEOUT_SECONDS:-45}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-3.6-flash}
      GEMINI_READ_TIMEOUT_SECONDS: ${GEMINI_READ_TIMEOUT_SECONDS:-60}
      GROK_API_BASE_URL: ${GROK_API_BASE_URL:-https://api.x.ai/v1}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROK_VISION_MODEL: ${GROK_VISION_MODEL:-grok-vision-beta}
      GROK_READ_TIMEOUT_SECONDS: ${GROK_READ_TIMEOUT_SECONDS:-60}
      OMP_NUM_THREADS: ${TICKET_VISION_CPU_THREADS:-1}
      OPENBLAS_NUM_THREADS: ${TICKET_VISION_CPU_THREADS:-1}
      MKL_NUM_THREADS: ${TICKET_VISION_CPU_THREADS:-1}
      NUMEXPR_NUM_THREADS: ${TICKET_VISION_CPU_THREADS:-1}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ticket_vision_model_cache:/cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 8
    mem_limit: ${TICKET_VISION_MEMORY_LIMIT:-1g}
    cpus: ${TICKET_VISION_CPU_LIMIT:-1}

  backend:
    image: ${BACKEND_IMAGE:-docker.io/kitops365/daiphat-be:prod}
    pull_policy: always
    restart: unless-stopped
    labels:
      dev.dozzle.group: Backend
      dev.dozzle.name: Backend
    env_file:
      - ./.env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      CORE_POSTGRES_HOST: postgres
      CORE_DB_PORT: 5432
      CORE_POSTGRES_DB: ${POSTGRES_DB:-daiphat_core_db}
      CORE_POSTGRES_USER: ${POSTGRES_USER:-daiphat}
      CORE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORE_POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-daiphat_core_db}?charSet=UTF-8
      CORE_REDIS_HOST: redis
      CORE_REDIS_PORT: 6379
      CORE_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_SSL_ENABLED: "false"
      DAIPHAT_AI_BASE_URL: ${DAIPHAT_AI_BASE_URL:-http://ai:8000}
      # The OCR profile may be enabled independently; the adapter turns an
      # unavailable OCR service into its existing soft result.
      DAIPHAT_TICKET_VISION_BASE_URL: ${DAIPHAT_TICKET_VISION_BASE_URL:-http://ticket-vision:8090}
      DAIPHAT_TICKET_VISION_RECOGNITION_ENGINE: ${TICKET_VISION_RECOGNITION_ENGINE:-groq}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx640m -XX:+UseContainerSupport}
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 12
    mem_limit: 1g

  frontend:
    image: ${FRONTEND_IMAGE:-docker.io/kitops365/daiphat-fe:prod}
    pull_policy: always
    restart: unless-stopped
    labels:
      dev.dozzle.group: Frontend
      dev.dozzle.name: Frontend
    environment:
      BACKEND_UPSTREAM: backend
      # Keep V8 heap comfortably under mem_limit so Node exits gracefully
      # instead of being hard OOM-killed by the container cgroup.
      NODE_OPTIONS: --max-old-space-size=400
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    labels: *dozzle-infrastructure-labels
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-_}
    entrypoint: ["/bin/sh", "/opt/daiphat/nginx/start.sh"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./daiphat-be/infra/nginx:/opt/daiphat/nginx:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 6
    mem_limit: 128m

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    labels: *dozzle-infrastructure-labels
    entrypoint: >-
      /bin/sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done;'
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      nginx:
        condition: service_healthy
    mem_limit: 128m

  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    labels: *dozzle-infrastructure-labels
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      POST: 0
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_api
    mem_limit: 128m

  dozzle:
    image: amir20/dozzle:v10.6.12
    restart: unless-stopped
    labels: *dozzle-infrastructure-labels
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      DOZZLE_BASE: /dozzle
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_ENABLE_MCP: "false"
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - ./.dozzle:/data
    ports:
      - "127.0.0.1:${DOZZLE_LOCAL_PORT:-9999}:8080"
    networks:
      - default
      - docker_api
    depends_on:
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 6
    mem_limit: 256m

  db-backup:
    build:
      context: ./daiphat-be/infra/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    labels: *dozzle-infrastructure-labels
    env_file:
      - ./.env.prod
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-daiphat_core_db}
      PGUSER: ${POSTGRES_USER:-daiphat}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      LOCAL_RETENTION_DAYS: ${LOCAL_RETENTION_DAYS:-7}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m

volumes:
  postgres_data:
  redis_data:
  certbot_conf:
  certbot_www:
  ticket_vision_model_cache:

networks:
  docker_api:
    internal: true
