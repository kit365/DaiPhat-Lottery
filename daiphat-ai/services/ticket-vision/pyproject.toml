# NOTE: requirements.txt is the dependency list Dockerfile/CI actually
# install from (matching services/chat-bot's convention). This file exists
# so ticket-vision participates in the daiphat-ai uv workspace declared in
# the repo-root pyproject.toml (`[tool.uv.workspace] members = ["services/*"]`)
# and carries proper packaging metadata. Keep the `dependencies` list below
# in sync with requirements.txt by hand until the service fully migrates to
# uv-managed installs.
[project]
name = "ticket-vision"
version = "0.1.0"
description = "Ticket Vision OCR microservice (DP-269): image preprocessing, ticket detection and OCR for lottery ticket scanning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.103.1",
    "uvicorn>=0.23.2",
    "pydantic>=2.3.0",
    "pydantic-settings>=2.0.3",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.26.4",
    "rapidfuzz>=3.6.1",
    "easyocr>=1.7.1",
    "paddleocr>=2.7.3",
    "paddlepaddle>=2.6.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.pytest.ini_options]
# "." resolves this service's top-level modules/packages (main, routers,
# domain, dto, conftest); ".." resolves the shared contracts/infra/libs at
# the daiphat-ai repo root -- mirrors the PYTHONPATH used in
# Dockerfile/scripts/run_ticket_vision.sh.
pythonpath = [".", ".."]
testpaths = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
