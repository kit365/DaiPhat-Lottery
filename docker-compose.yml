name: daiphat-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: daiphat_core_db
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: "12345"
    ports:
      - "${LOCAL_POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d daiphat_core_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${LOCAL_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  ai:
    build:
      context: ./daiphat-ai
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${LOCAL_AI_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: ./daiphat-be/core-api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/daiphat_core_db?charSet=UTF-8
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "12345"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      DAIPHAT_AI_BASE_URL: http://ai:8000
    ports:
      - "${LOCAL_BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

  frontend:
    build:
      context: ./daiphat-fe
      dockerfile: Dockerfile
      secrets:
        - source: frontend_env
          target: env_file
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: backend
    ports:
      - "${LOCAL_FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

secrets:
  frontend_env:
    file: ${FRONTEND_LOCAL_ENV_FILE:-./daiphat-fe/.env}

volumes:
  postgres_data:
  redis_data:
