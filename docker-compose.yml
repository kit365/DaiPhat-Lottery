name: daiphat-local

# Default local command: docker compose up --build
# It validates the exact fullstack image that will later run on Azure.
services:
  postgres-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: daiphat_core_db
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: "12345"
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d daiphat_core_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile.azure
    env_file:
      - ./.env.local
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/daiphat_core_db?charSet=UTF-8
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "12345"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 2m
      retries: 12

volumes:
  postgres_data:
  redis_data:
