name: daiphat-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: daiphat_core_db
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: "12345"
    ports:
      - "${LOCAL_POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d daiphat_core_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${LOCAL_REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  ai:
    build:
      context: ./daiphat-ai
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${LOCAL_AI_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  ticket-vision:
    build:
      context: ./daiphat-ai
      dockerfile: services/ticket-vision/Dockerfile
    restart: unless-stopped
    environment:
      HOME: /cache
      EASYOCR_MODULE_PATH: /cache/easyocr
      PADDLE_PDX_CACHE_HOME: /cache/paddlex
      HF_HOME: /cache/huggingface
      TORCH_HOME: /cache/torch
      YOLO_CONFIG_DIR: /cache/ultralytics
      TICKET_VISION_YOLO_DEVICE: cpu
      TICKET_VISION_RECOGNITION_ENGINE: ${TICKET_VISION_RECOGNITION_ENGINE:-groq}
      OCR_AI_PROVIDER: ${OCR_AI_PROVIDER:-}
      GROQ_API_BASE_URL: ${GROQ_API_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.6-27b}
      GROQ_READ_TIMEOUT_SECONDS: ${GROQ_READ_TIMEOUT_SECONDS:-60}
      GEMINI_API_BASE_URL: ${GEMINI_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-3.6-flash}
      GEMINI_READ_TIMEOUT_SECONDS: ${GEMINI_READ_TIMEOUT_SECONDS:-60}
      GROK_API_BASE_URL: ${GROK_API_BASE_URL:-https://api.x.ai/v1}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROK_VISION_MODEL: ${GROK_VISION_MODEL:-grok-vision-beta}
      GROK_READ_TIMEOUT_SECONDS: ${GROK_READ_TIMEOUT_SECONDS:-60}
      OMP_NUM_THREADS: "${LOCAL_TICKET_VISION_CPU_THREADS:-2}"
      OPENBLAS_NUM_THREADS: "${LOCAL_TICKET_VISION_CPU_THREADS:-2}"
      MKL_NUM_THREADS: "${LOCAL_TICKET_VISION_CPU_THREADS:-2}"
      NUMEXPR_NUM_THREADS: "${LOCAL_TICKET_VISION_CPU_THREADS:-2}"
    ports:
      - "127.0.0.1:${LOCAL_TICKET_VISION_PORT:-8090}:8090"
    volumes:
      - ticket_vision_model_cache:/cache
      - type: bind
        source: ./daiphat-ai/services/ticket-vision/models
        target: /app/services/ticket-vision/models
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 6
    mem_limit: ${LOCAL_TICKET_VISION_MEMORY:-4g}
    cpus: ${LOCAL_TICKET_VISION_CPUS:-2}

  backend:
    build:
      context: ./daiphat-be/core-api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/daiphat_core_db?charSet=UTF-8
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "12345"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      DAIPHAT_AI_BASE_URL: http://ai:8000
      DAIPHAT_TICKET_VISION_BASE_URL: http://ticket-vision:8090
      DAIPHAT_TICKET_VISION_RECOGNITION_ENGINE: ${TICKET_VISION_RECOGNITION_ENGINE:-groq}
    ports:
      - "${LOCAL_BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
      ticket-vision:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12

  frontend:
    build:
      context: ./daiphat-fe
      dockerfile: Dockerfile
      secrets:
        - source: frontend_env
          target: env_file
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: backend
    ports:
      - "${LOCAL_FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

secrets:
  frontend_env:
    file: ./.env

volumes:
  postgres_data:
  redis_data:
  ticket_vision_model_cache:
