name: DaiPhat AI Deploy

on:
  push:
    branches:
      - main
    paths:
      - "daiphat-ai/**"
      # ticket-vision has its own (much heavier) image and workflow --
      # see ticket-vision-deploy.yml. Excluded so a change there doesn't
      # needlessly rebuild and redeploy chat-bot.
      - "!daiphat-ai/services/ticket-vision/**"
      - ".github/workflows/ai-deploy.yml"
      - ".github/workflows/component-deploy.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build and deploy
        required: true
        default: main
        type: choice
        options:
          - main
          - feature/dp-5-infs

jobs:
  deploy-ai:
    uses: ./.github/workflows/component-deploy.yml
    with:
      component: ai
      source_ref: ${{ inputs.source_ref || github.ref_name }}
    secrets: inherit
