name: DaiPhat Backend CI

on:
  pull_request:
    paths:
      - "daiphat-be/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daiphat-be/core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          cache-dependency-path: daiphat-be/core-api/pom.xml
      # Legacy tests still reference removed domain packages. Keep this gate
      # aligned with the production Docker build until that debt is repaired.
      - name: Compile and package backend
        run: mvn -B clean package -Dmaven.test.skip=true -Dcheckstyle.skip
