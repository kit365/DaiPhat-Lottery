# Trigger deployment for production stabilization
name: Microservices Backend Deploy

on:
  push:
    branches: [ "main", "staging", "feature/dp-5-infs-test", "feature/dp-5-infs", "feature/dp-5-infs-backup" ]
    paths:
      - 'daiphat-be/**'
      - 'docker-compose.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [
          { name: "daiphat-config-server", context: "./daiphat-be", dockerfile: "./daiphat-be/config-server/Dockerfile" },
          { name: "daiphat-discovery-server", context: "./daiphat-be", dockerfile: "./daiphat-be/discovery-server/Dockerfile" },
          { name: "daiphat-api-gateway", context: "./daiphat-be", dockerfile: "./daiphat-be/api-gateway-service/Dockerfile" },
          { name: "daiphat-account-service", context: "./daiphat-be", dockerfile: "./daiphat-be/account-service/Dockerfile" }
        ]
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ghcr.io/kit365/${{ matrix.service.name }}:latest
          cache-from: type=registry,ref=ghcr.io/kit365/${{ matrix.service.name }}:buildcache
          cache-to: type=inline

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Copy configurations to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,daiphat-be/infra,daiphat-be/config"
          target: ${{ secrets.VPS_DEPLOY_PATH }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            cat <<'EOF' > .env
            ${{ secrets.ENV_FILE_CONTENT }}
            EOF
            
            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker compose pull
            docker compose up -d
            docker compose restart nginx
