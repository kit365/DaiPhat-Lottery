name: DaiPhat Component Deploy

on:
  workflow_call:
    inputs:
      component:
        description: Application component to build and deploy
        required: true
        type: string
      source_ref:
        description: Git ref to build and deploy
        required: true
        type: string

      release_channel:
        description: Optional channel when source_ref is an immutable SHA
        type: string
        default: ''
      existing_image:
        description: Optional repository@sha256 image; skip building
        type: string
        default: ''

concurrency:
  group: daiphat-production-${{ inputs.component }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      channel: ${{ steps.source.outputs.channel }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Validate component
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          [[ "$COMPONENT" =~ ^(backend|frontend|ai|ticket-vision)$ ]]

      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Resolve immutable image name
        id: source
        env:
          COMPONENT: ${{ inputs.component }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if [[ -n "$RELEASE_CHANNEL" ]]; then
            [[ "$RELEASE_CHANNEL" =~ ^(prod|candidate)$ ]]
            channel="$RELEASE_CHANNEL"
          elif [[ "$SOURCE_REF" == "main" ]]; then
            channel=prod
          else
            channel=candidate
          fi
          case "$COMPONENT" in
            backend) repository=daiphat-be ;;
            frontend) repository=daiphat-fe ;;
            ai) repository=daiphat-ai ;;
            ticket-vision) repository=daiphat-ticket-vision ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "IMAGE=docker.io/$DOCKER_USERNAME/$repository:$channel-$sha" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare frontend build environment
        if: ${{ inputs.existing_image == '' && inputs.component == 'frontend' }}
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ENV_FILE_CONTENT"
          printf '%s\n' "$ENV_FILE_CONTENT" | awk '/^VITE_[A-Z0-9_]*=/' > /tmp/daiphat-fe.env
          domain_name=$(printf '%s\n' "$ENV_FILE_CONTENT" | awk -F= '$1 == "DOMAIN_NAME" { value=substr($0, length($1)+2) } END { print value }')
          test -n "$domain_name"
          if ! grep -q '^VITE_WS_BASE_URL=.' /tmp/daiphat-fe.env; then
            printf 'VITE_WS_BASE_URL=https://%s\n' "$domain_name" >> /tmp/daiphat-fe.env
          fi
          test -s /tmp/daiphat-fe.env
          printf 'VITE_ENV_HASH=%s\n' "$(sha256sum /tmp/daiphat-fe.env | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Build and push backend
        id: build-backend
        if: ${{ inputs.existing_image == '' && inputs.component == 'backend' }}
        uses: docker/build-push-action@v7
        with:
          context: ./daiphat-be/core-api
          file: ./daiphat-be/core-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=registry,ref=docker.io/${{ secrets.DOCKER_USERNAME }}/daiphat-be:buildcache
          cache-to: type=registry,ref=docker.io/${{ secrets.DOCKER_USERNAME }}/daiphat-be:buildcache,mode=max

      - name: Build and push frontend
        id: build-frontend
        if: ${{ inputs.existing_image == '' && inputs.component == 'frontend' }}
        uses: docker/build-push-action@v7
        with:
          context: ./daiphat-fe
          file: ./daiphat-fe/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          build-args: |
            VITE_ENV_HASH=${{ env.VITE_ENV_HASH }}
          secret-files: |
            env_file=/tmp/daiphat-fe.env
          cache-from: type=registry,ref=docker.io/${{ secrets.DOCKER_USERNAME }}/daiphat-fe:buildcache
          cache-to: type=registry,ref=docker.io/${{ secrets.DOCKER_USERNAME }}/daiphat-fe:buildcache,mode=max

      - name: Build and push AI
        id: build-chatbot
        if: ${{ inputs.existing_image == '' && inputs.component == 'ai' }}
        uses: docker/build-push-action@v7
        with:
          context: ./daiphat-ai
          file: ./daiphat-ai/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=registry,ref=docker.io/${{ secrets.DOCKER_USERNAME }}/daiphat-ai:buildcache
          cache-to: type=registry,ref=docker.io/${{ secrets.DOCKER_USERNAME }}/daiphat-ai:buildcache,mode=max

      - name: Fetch ticket-vision model weights
        if: ${{ inputs.existing_image == '' && inputs.component == 'ticket-vision' }}
        env:
          WEIGHTS_URL: ${{ secrets.TICKET_VISION_WEIGHTS_URL }}
          WEIGHTS_SHA256: ${{ vars.TICKET_VISION_WEIGHTS_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$WEIGHTS_URL" || { echo "TICKET_VISION_WEIGHTS_URL is required for OCR builds." >&2; exit 1; }
          mkdir -p daiphat-ai/services/ticket-vision/models
          curl -fsSL "$WEIGHTS_URL" -o daiphat-ai/services/ticket-vision/models/best.pt
          test -n "$WEIGHTS_SHA256" || { echo "TICKET_VISION_WEIGHTS_SHA256 is required." >&2; exit 1; }
          printf '%s  %s\n' "$WEIGHTS_SHA256" daiphat-ai/services/ticket-vision/models/best.pt | sha256sum --check --status
          # A wrong URL that returns an HTML error page would otherwise be
          # baked in as "weights" and only fail at first scan.
          python - <<'PY'
          import sys
          from pathlib import Path
          weights = Path("daiphat-ai/services/ticket-vision/models/best.pt")
          size = weights.stat().st_size
          if size < 1_000_000:
              sys.exit(f"Downloaded weights are implausibly small ({size} bytes); check TICKET_VISION_WEIGHTS_URL.")
          if weights.read_bytes()[:2] != b"PK":
              sys.exit("Downloaded weights are not a torch checkpoint (expected a zip archive).")
          print(f"Weights OK: {size} bytes")
          PY

      - name: Build and push ticket-vision
        id: build-ocr
        if: ${{ inputs.existing_image == '' && inputs.component == 'ticket-vision' }}
        uses: docker/build-push-action@v7
        with:
          context: ./daiphat-ai
          file: ./daiphat-ai/services/ticket-vision/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=registry,ref=docker.io/${{ secrets.DOCKER_USERNAME }}/daiphat-ticket-vision:buildcache
          cache-to: type=registry,ref=docker.io/${{ secrets.DOCKER_USERNAME }}/daiphat-ticket-vision:buildcache,mode=max

      - name: Resolve deployment digest
        id: image
        env:
          EXISTING_IMAGE: ${{ inputs.existing_image }}
          BUILT_DIGEST: ${{ steps.build-backend.outputs.digest || steps.build-frontend.outputs.digest || steps.build-chatbot.outputs.digest || steps.build-ocr.outputs.digest }}
        run: |
          set -euo pipefail
          repository="${IMAGE%:*}"
          if [[ -n "$EXISTING_IMAGE" ]]; then
            [[ "$EXISTING_IMAGE" == "$repository"@sha256:* ]]
            [[ "${EXISTING_IMAGE##*@sha256:}" =~ ^[a-f0-9]{64}$ ]]
            resolved="$EXISTING_IMAGE"
          else
            [[ "$BUILT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
            resolved="$repository@$BUILT_DIGEST"
          fi
          echo "image=$resolved" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-push.outputs.source_sha }}

      - name: Prepare protected runtime files
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ENV_FILE_CONTENT"
          if [[ "$COMPONENT" == ai || "$COMPONENT" == ticket-vision ]]; then
            if [[ "$COMPONENT" == ai ]]; then
              printf '%s\n' "$ENV_FILE_CONTENT" | awk '/^AI_[A-Z0-9_]*=/' > .ai-runtime.env
            else
              printf '%s\n' "$ENV_FILE_CONTENT" | awk '/^(GROQ_|GEMINI_|GROK_|TICKET_VISION_|AI_)[A-Z0-9_]*=|^OCR_AI_PROVIDER=/' > .ai-runtime.env
            fi
            exit 0
          fi
          mkdir -p .dozzle
          dozzle_username=$(printf '%s\n' "$ENV_FILE_CONTENT" | awk -F= '$1 == "DOZZLE_AUTH_USERNAME" { value=substr($0, length($1)+2) } END { print value }')
          dozzle_password_hash=$(printf '%s\n' "$ENV_FILE_CONTENT" | awk -F= '$1 == "DOZZLE_AUTH_PASSWORD_HASH" { value=substr($0, length($1)+2) } END { print value }')
          [[ "$dozzle_username" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$dozzle_password_hash" =~ ^\$2[aby]\$ ]]
          printf '%s\n' "$ENV_FILE_CONTENT" \
            | awk -F= '$1 != "DOZZLE_AUTH_USERNAME" && $1 != "DOZZLE_AUTH_PASSWORD_HASH"' \
            > .env.prod
          {
            printf 'users:\n'
            printf '  %s:\n' "$dozzle_username"
            printf '    name: DaiPhat Admin\n'
            printf "    password: '%s'\n" "$dozzle_password_hash"
            printf '    filter:\n'
            printf '    roles: none\n'
          } > .dozzle/users.yml
          chmod 700 .dozzle
          chmod 600 .env.prod .dozzle/users.yml

      - name: Configure and validate VPS SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "VPS_SSH_KEY is unavailable; use a repository Actions secret." >&2; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          key_file="$HOME/.ssh/daiphat_vps_deploy"
          key_material=$(printf '%s\n' "$SSH_KEY" | sed -E 's/^[[:space:]]*\*\*//; s/\*\*[[:space:]]*$//; s/\r$//')
          first_key_line=${key_material%%$'\n'*}
          if [[ "$first_key_line" =~ ^-----BEGIN\ (OPENSSH|RSA)\ PRIVATE\ KEY-----$ ]]; then
            printf '%s\n' "$key_material" > "$key_file"
          else
            key_body=$(printf '%s' "$key_material" | tr -d '[:space:]')
            {
              printf '%s\n' '-----BEGIN OPENSSH PRIVATE KEY-----'
              printf '%s\n' "$key_body" | fold -w 70
              printf '%s\n' '-----END OPENSSH PRIVATE KEY-----'
            } > "$key_file"
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null 2>&1 || {
            echo "VPS_SSH_KEY is not a valid OpenSSH private key after normalization." >&2
            exit 1
          }
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Stage component deployment package on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          archive_name="component-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          echo "DEPLOY_ARCHIVE=$archive_name" >> "$GITHUB_ENV"
          if [[ "$COMPONENT" == ai || "$COMPONENT" == ticket-vision ]]; then
            files=(docker-compose.ai.yml scripts/deploy-ai.sh .ai-runtime.env)
          else
            files=(docker-compose.prod.yml daiphat-be/infra/backup scripts/deploy-component.sh scripts/vps-preflight.sh .env.prod .dozzle/users.yml)
          fi
          tar -czf - "${files[@]}" \
            | ssh -i "$HOME/.ssh/daiphat_vps_deploy" -o BatchMode=yes -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" \
              "install -d -m 700 '$VPS_DEPLOY_PATH' '$VPS_DEPLOY_PATH/.incoming' && cat > '$VPS_DEPLOY_PATH/.incoming/$archive_name'"

      - name: Deploy component with health gate and rollback
        env:
          COMPONENT: ${{ inputs.component }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_CHANNEL: ${{ needs.build-and-push.outputs.channel }}
          SOURCE_SHA: ${{ needs.build-and-push.outputs.source_sha }}
          RESOLVED_IMAGE: ${{ needs.build-and-push.outputs.image }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            backend) repository=daiphat-be ;;
            frontend) repository=daiphat-fe ;;
            ai) repository=daiphat-ai ;;
            ticket-vision) repository=daiphat-ticket-vision ;;
          esac
          image="$RESOLVED_IMAGE"
          printf '%s' "$DOCKER_PASSWORD" | ssh -i "$HOME/.ssh/daiphat_vps_deploy" -o BatchMode=yes -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" \
            "docker login docker.io -u '$DOCKER_USERNAME' --password-stdin"
          # Values below intentionally expand on the trusted runner before the script is sent.
          # shellcheck disable=SC2087
          ssh -i "$HOME/.ssh/daiphat_vps_deploy" -o BatchMode=yes -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" <<EOF
            set -eu
            command -v flock >/dev/null 2>&1 || { echo "Missing required VPS command: flock" >&2; exit 1; }
            if ! flock -w 3600 "$VPS_DEPLOY_PATH/.deploy.lock" bash -c '
              set -eu
              tar -xzf "$VPS_DEPLOY_PATH/.incoming/$DEPLOY_ARCHIVE" -C "$VPS_DEPLOY_PATH"
              rm -f "$VPS_DEPLOY_PATH/.incoming/$DEPLOY_ARCHIVE"
              cd "$VPS_DEPLOY_PATH"
              if [ "$COMPONENT" = ai ] || [ "$COMPONENT" = ticket-vision ]; then
                chmod 700 scripts/deploy-ai.sh
                scripts/deploy-ai.sh "$COMPONENT" "$image" "$SOURCE_SHA"
              else
                chmod 700 scripts/deploy-component.sh scripts/vps-preflight.sh
                scripts/vps-preflight.sh "$VPS_DEPLOY_PATH" "$COMPONENT"
                scripts/deploy-component.sh "$COMPONENT" "$image" "$SOURCE_SHA"
              fi
            '; then
              rm -f "$VPS_DEPLOY_PATH/.incoming/$DEPLOY_ARCHIVE"
              exit 1
            fi
          EOF

      - name: Remove temporary VPS SSH key
        if: always()
        run: rm -f "$HOME/.ssh/daiphat_vps_deploy"

  promote-main:
    if: ${{ needs.build-and-push.outputs.channel == 'prod' }}
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Promote verified component image
        env:
          COMPONENT: ${{ inputs.component }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SOURCE_SHA: ${{ needs.build-and-push.outputs.source_sha }}
          RESOLVED_IMAGE: ${{ needs.build-and-push.outputs.image }}
          IMAGE_CHANNEL: ${{ needs.build-and-push.outputs.channel }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            backend) repository=daiphat-be ;;
            frontend) repository=daiphat-fe ;;
            ai) repository=daiphat-ai ;;
            ticket-vision) repository=daiphat-ticket-vision ;;
          esac
          image="$RESOLVED_IMAGE"
          docker buildx imagetools create -t "docker.io/$DOCKER_USERNAME/$repository:prod" "$image"
