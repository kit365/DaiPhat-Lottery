name: Microservices Frontend Deploy

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create temp env file for build secrets
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        run: |
          printf "%s" "$ENV_CONTENT" > /tmp/.env.build

      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./daiphat-fe
          file: ./daiphat-fe/Dockerfile
          push: true
          tags: ghcr.io/kit365/daiphat-fe:latest
          secret-files: |
            env_file=/tmp/.env.build
          cache-from: type=registry,ref=ghcr.io/kit365/daiphat-fe:buildcache
          cache-to: type=inline

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Copy configurations to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,daiphat-be/infra"
          target: ${{ secrets.VPS_DEPLOY_PATH }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
            
            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker compose pull daiphat-fe nginx
            docker compose up -d daiphat-fe nginx
