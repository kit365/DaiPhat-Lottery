name: Flutter - Android Build Dev

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: daiphat_mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.44.1

      - name: Create Flutter environment file
        env:
          MOBILE_ENV_FILE: ${{ secrets.MOBILE_ENV_FILE }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$MOBILE_ENV_FILE" ]; then
            printf '%s\n' "$MOBILE_ENV_FILE" > .env
          elif [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env
          else
            echo "Missing GitHub Actions secret MOBILE_ENV_FILE or ENV_FILE."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --build-name=1.0.0 --build-number=1