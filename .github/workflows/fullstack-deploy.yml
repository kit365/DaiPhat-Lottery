name: DaiPhat Fullstack Deploy

on:
  push:
    branches:
      - feature/dp-5-infs
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build and deploy
        required: true
        default: feature/dp-5-infs
        type: choice
        options:
          - feature/dp-5-infs
          - main

concurrency:
  group: daiphat-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      channel: ${{ steps.source.outputs.channel }}
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref_name }}

      - name: Resolve immutable image names
        id: source
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if [[ "$SOURCE_REF" == "main" ]]; then
            channel=prod
          else
            channel=candidate
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "backend_image=docker.io/$DOCKER_USERNAME/daiphat-be:$channel-$sha" >> "$GITHUB_OUTPUT"
          echo "frontend_image=docker.io/$DOCKER_USERNAME/daiphat-fe:$channel-$sha" >> "$GITHUB_OUTPUT"
          echo "ai_image=docker.io/$DOCKER_USERNAME/daiphat-ai:$channel-$sha" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare frontend build environment
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ENV_FILE_CONTENT"
          printf '%s\n' "$ENV_FILE_CONTENT" | awk '/^VITE_[A-Z0-9_]*=/' > /tmp/daiphat-fe.env
          domain_name=$(printf '%s\n' "$ENV_FILE_CONTENT" | awk -F= '$1 == "DOMAIN_NAME" { value=substr($0, length($1)+2) } END { print value }')
          test -n "$domain_name"
          if ! grep -q '^VITE_WS_BASE_URL=.' /tmp/daiphat-fe.env; then
            printf 'VITE_WS_BASE_URL=https://%s\n' "$domain_name" >> /tmp/daiphat-fe.env
          fi
          test -s /tmp/daiphat-fe.env
          printf 'VITE_ENV_HASH=%s\n' "$(sha256sum /tmp/daiphat-fe.env | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./daiphat-be/core-api
          file: ./daiphat-be/core-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.source.outputs.backend_image }}
          cache-from: type=registry,ref=docker.io/${{ secrets.DOCKER_USERNAME }}/daiphat-be:buildcache
          cache-to: type=registry,ref=docker.io/${{ secrets.DOCKER_USERNAME }}/daiphat-be:buildcache,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./daiphat-fe
          file: ./daiphat-fe/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.source.outputs.frontend_image }}
          build-args: |
            VITE_ENV_HASH=${{ env.VITE_ENV_HASH }}
          secret-files: |
            env_file=/tmp/daiphat-fe.env
          cache-from: type=registry,ref=docker.io/${{ secrets.DOCKER_USERNAME }}/daiphat-fe:buildcache
          cache-to: type=registry,ref=docker.io/${{ secrets.DOCKER_USERNAME }}/daiphat-fe:buildcache,mode=max

      - name: Build and push AI
        uses: docker/build-push-action@v7
        with:
          context: ./daiphat-ai
          file: ./daiphat-ai/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.source.outputs.ai_image }}
          cache-from: type=registry,ref=docker.io/${{ secrets.DOCKER_USERNAME }}/daiphat-ai:buildcache
          cache-to: type=registry,ref=docker.io/${{ secrets.DOCKER_USERNAME }}/daiphat-ai:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref_name }}

      - name: Prepare protected runtime files
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SOURCE_SHA: ${{ needs.build-and-push.outputs.source_sha }}
          IMAGE_CHANNEL: ${{ needs.build-and-push.outputs.channel }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ENV_FILE_CONTENT"
          test -n "$DOCKER_USERNAME"
          test -n "$SOURCE_SHA"
          test -n "$IMAGE_CHANNEL"
          BACKEND_IMAGE="docker.io/$DOCKER_USERNAME/daiphat-be:$IMAGE_CHANNEL-$SOURCE_SHA"
          FRONTEND_IMAGE="docker.io/$DOCKER_USERNAME/daiphat-fe:$IMAGE_CHANNEL-$SOURCE_SHA"
          AI_IMAGE="docker.io/$DOCKER_USERNAME/daiphat-ai:$IMAGE_CHANNEL-$SOURCE_SHA"
          mkdir -p .dozzle
          dozzle_username=$(printf '%s\n' "$ENV_FILE_CONTENT" | awk -F= '$1 == "DOZZLE_AUTH_USERNAME" { value=substr($0, length($1)+2) } END { print value }')
          dozzle_password_hash=$(printf '%s\n' "$ENV_FILE_CONTENT" | awk -F= '$1 == "DOZZLE_AUTH_PASSWORD_HASH" { value=substr($0, length($1)+2) } END { print value }')
          [[ "$dozzle_username" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$dozzle_password_hash" =~ ^\$2[aby]\$ ]]
          printf '%s\n' "$ENV_FILE_CONTENT" \
            | awk -F= '$1 != "DOZZLE_AUTH_USERNAME" && $1 != "DOZZLE_AUTH_PASSWORD_HASH"' \
            > .env.prod
          {
            printf 'users:\n'
            printf '  %s:\n' "$dozzle_username"
            printf '    name: DaiPhat Admin\n'
            printf "    password: '%s'\n" "$dozzle_password_hash"
            printf '    filter:\n'
            printf '    roles: none\n'
          } > .dozzle/users.yml
          printf 'BACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\nAI_IMAGE=%s\nDEPLOY_SHA=%s\n' \
            "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$AI_IMAGE" "$SOURCE_SHA" > .deploy.env
          # scp-action runs in a separate container, so it must be able to read
          # these ephemeral runner files. deploy-prod.sh locks them on the VPS.
          chmod 755 .dozzle
          chmod 644 .env.prod .deploy.env .dozzle/users.yml

      - name: Configure and validate VPS SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo "VPS_SSH_KEY is unavailable; use a repository Actions secret." >&2; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          key_file="$HOME/.ssh/daiphat_vps_deploy"
          key_material=$(printf '%s\n' "$SSH_KEY" | sed -E 's/^[[:space:]]*\*\*//; s/\*\*[[:space:]]*$//; s/\r$//')
          if printf '%s\n' "$key_material" | head -n 1 | grep -Eq '^-----BEGIN (OPENSSH|RSA) PRIVATE KEY-----$'; then
            printf '%s\n' "$key_material" > "$key_file"
          else
            key_body=$(printf '%s' "$key_material" | tr -d '[:space:]')
            {
              printf '%s\n' '-----BEGIN OPENSSH PRIVATE KEY-----'
              printf '%s\n' "$key_body" | fold -w 70
              printf '%s\n' '-----END OPENSSH PRIVATE KEY-----'
            } > "$key_file"
          fi
          chmod 600 "$key_file"
          if ! ssh-keygen -y -f "$key_file" >/dev/null 2>&1; then
            echo "VPS_SSH_KEY is not a valid OpenSSH private key after normalization." >&2
            exit 1
          fi
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Copy production stack to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          tar -czf - docker-compose.prod.yml daiphat-be/infra scripts/deploy-prod.sh scripts/bootstrap-tls.sh scripts/vps-preflight.sh .env.prod .deploy.env .dozzle/users.yml \
            | ssh -i "$HOME/.ssh/daiphat_vps_deploy" -o BatchMode=yes -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" \
              "mkdir -p '$VPS_DEPLOY_PATH' && tar -xzf - -C '$VPS_DEPLOY_PATH'"

      - name: Deploy and verify on VPS
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKER_PASSWORD" | ssh -i "$HOME/.ssh/daiphat_vps_deploy" -o BatchMode=yes -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" \
            "docker login docker.io -u '$DOCKER_USERNAME' --password-stdin"
          ssh -i "$HOME/.ssh/daiphat_vps_deploy" -o BatchMode=yes -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" <<EOF
            set -eu
            cd "$VPS_DEPLOY_PATH"
            chmod 700 scripts/deploy-prod.sh scripts/bootstrap-tls.sh scripts/vps-preflight.sh
            scripts/vps-preflight.sh "$VPS_DEPLOY_PATH"
            scripts/deploy-prod.sh
          EOF

      - name: Remove temporary VPS SSH key
        if: always()
        run: rm -f "$HOME/.ssh/daiphat_vps_deploy"

  promote-main:
    if: ${{ (inputs.source_ref || github.ref_name) == 'main' }}
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Promote verified image pair
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SOURCE_SHA: ${{ needs.build-and-push.outputs.source_sha }}
          IMAGE_CHANNEL: ${{ needs.build-and-push.outputs.channel }}
        run: |
          set -euo pipefail
          BACKEND_IMAGE="docker.io/$DOCKER_USERNAME/daiphat-be:$IMAGE_CHANNEL-$SOURCE_SHA"
          FRONTEND_IMAGE="docker.io/$DOCKER_USERNAME/daiphat-fe:$IMAGE_CHANNEL-$SOURCE_SHA"
          AI_IMAGE="docker.io/$DOCKER_USERNAME/daiphat-ai:$IMAGE_CHANNEL-$SOURCE_SHA"
          docker buildx imagetools create -t "docker.io/$DOCKER_USERNAME/daiphat-be:prod" "$BACKEND_IMAGE"
          docker buildx imagetools create -t "docker.io/$DOCKER_USERNAME/daiphat-fe:prod" "$FRONTEND_IMAGE"
          docker buildx imagetools create -t "docker.io/$DOCKER_USERNAME/daiphat-ai:prod" "$AI_IMAGE"
