name: SmartLotto CI - Build & Test

on:
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔍 Checkout Code
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 🎨 Code Linting (Checkstyle)
      run: mvn checkstyle:check
      # This step will fail if any style violations are found, blocking the PR.

    - name: 🧪 Run Unit Tests
      run: mvn test

    - name: 🏗️ Build Project
      run: mvn clean install -DskipTests
