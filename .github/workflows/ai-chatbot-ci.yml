name: AI Chatbot CI

on:
  pull_request:
    paths:
      - "daiphat-ai/ai-chatbot/**"
      - ".github/workflows/ai-chatbot-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-chatbot-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: AI Chatbot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daiphat-ai/ai-chatbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daiphat-ai/ai-chatbot/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Test
        env:
          PYTHONPATH: .
        run: pytest -q
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./daiphat-ai/ai-chatbot
          file: ./daiphat-ai/ai-chatbot/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ai-chatbot
          cache-to: type=gha,scope=ai-chatbot,mode=max
